[package]
name = "sysinfo-dashboard"
version = "0.1.0"
edition = "2021"
description = "SysInfo Dashboard - Rust native Android diagnostics app"

[lib]
name = "sysinfo_dashboard"
crate-type = ["cdylib"]

[dependencies]
log = "0.4"
android_logger = "0.13"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.android.signing.release]
path = "/tmp/release.keystore"
keystore_password = "android"
alias = "release"
password = "android"
