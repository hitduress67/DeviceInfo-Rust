name: Build Rust APK

on:
  push:
    branches: [ "rust" ]
    tags:
      - 'rust-v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: sysinfo-dashboard

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Build APK
        working-directory: sysinfo-dashboard
        run: cargo apk build --release

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore /tmp/release.keystore \
            -alias release -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass android -keypass android \
            -dname "CN=SysInfo Dashboard, O=hitduress67, C=US"
          HASH=$(ls sysinfo-dashboard/target/release/apk/ | head -1)
          cp sysinfo-dashboard/target/release/apk/$HASH/sysinfo-dashboard.apk /tmp/unsigned.apk 2>/dev/null || \
          cp sysinfo-dashboard/target/release/apk/sysinfo-dashboard.apk /tmp/unsigned.apk 2>/dev/null || true
          ls -la sysinfo-dashboard/target/release/apk/

      - name: Upload APK (debug CI artifact)
        uses: actions/upload-artifact@v4
        with:
          name: sysinfo-dashboard-rust.apk
          path: sysinfo-dashboard/target/release/apk/**/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/rust-v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "SysInfo Dashboard Rust v${{ github.ref_name }}" \
            --notes "Rust-native Android diagnostics app. Built with cargo-apk + NativeActivity." \
            --prerelease \
            sysinfo-dashboard/target/release/apk/**/*.apk
