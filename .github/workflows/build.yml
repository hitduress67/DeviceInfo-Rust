name: Build Rust APK

on:
  push:
    branches: [ "rust" ]
    tags:
      - 'rust-v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: sysinfo-dashboard

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platforms
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-30" "platforms;android-34" 2>&1 | tail -5

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Build APK
        working-directory: sysinfo-dashboard
        run: |
          keytool -genkey -v -keystore /tmp/release.keystore \
            -alias release -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass android -keypass android \
            -dname "CN=SysInfo Dashboard, O=hitduress67, C=US"
          cargo apk build --release

      - name: Locate APK
        run: |
          mkdir -p /tmp/apk
          find . -path "*/target/release/apk/*.apk" -type f 2>/dev/null | head -5
          cp $(find . -path "*/target/release/apk/*.apk" -type f | grep -v unaligned | head -1) /tmp/sysinfo-dashboard-rust.apk || true
          if [ -f /tmp/sysinfo-dashboard-rust.apk ]; then
            echo "APK: $(ls -lh /tmp/sysinfo-dashboard-rust.apk | awk '{print $5}')"
          else
            # Try broader search
            find /home/runner/work -name "*.apk" -type f 2>/dev/null | head -5
            cp $(find /home/runner/work -name "*.apk" -type f | grep -v unaligned | head -1) /tmp/sysinfo-dashboard-rust.apk || true
            if [ ! -f /tmp/sysinfo-dashboard-rust.apk ]; then
              echo "No APK found"
              exit 1
            fi
          fi

      - name: Upload APK (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sysinfo-dashboard-rust.apk
          path: /tmp/sysinfo-dashboard-rust.apk

      - name: Create Pre-release
        if: startsWith(github.ref, 'refs/tags/rust-v')
        working-directory: sysinfo-dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "SysInfo Dashboard Rust v${{ github.ref_name }}" \
            --notes "Rust-native Android diagnostics app. Built with cargo-apk. Features: device info, CPU, RAM, storage, network, local + public IP, uptime." \
            --prerelease --overwrite \
            /tmp/sysinfo-dashboard-rust.apk
